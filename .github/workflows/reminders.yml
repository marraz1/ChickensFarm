name: Reminders

# Each app's reminders, from the default branch (#244). The batch itself is in
# reminders-dispatch.yml. Repository variables switch each app:
#   REMINDERS_V1, REMINDERS_V2 — an app sends only when its variable is "on".
# Explicit on purpose: a deleted or mistyped variable stops reminders rather
# than starting a second app's (after the cutover both apps hold the same
# users, and only V2 sends — #245).

on:
  schedule:
    # Times are UTC, which does not matter: the app resolves each user's own
    # time zone itself, so the schedule only needs to tick often enough. Kept off
    # the top of the hour because :00 is GitHub's busiest minute and the most
    # likely to be delayed.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  # Defence in depth only — correctness comes from the compare-and-set claim in
  # the reminder batch, which makes the endpoint idempotent for the local day.
  group: reminders
  cancel-in-progress: false

jobs:
  v1:
    name: V1 reminders
    if: vars.REMINDERS_V1 == 'on'
    uses: ./.github/workflows/reminders-dispatch.yml
    with:
      app: V1
      app_url: ${{ vars.APP_URL }}
    secrets:
      cron_secret: ${{ secrets.CRON_SECRET }}

  v2:
    name: V2 reminders
    if: vars.REMINDERS_V2 == 'on'
    uses: ./.github/workflows/reminders-dispatch.yml
    with:
      app: V2
      app_url: ${{ vars.APP_URL_V2 }}
    secrets:
      cron_secret: ${{ secrets.CRON_SECRET_V2 }}
