name: Status

# A single place to answer "is production alive, what is deployed, and did the
# migration run?" — for each app (#244). The checks live in status-check.yml;
# this runs them for V1 and for V2, each with its own URL, secret, source
# branch and Vercel project.

on:
  # Deliberately not triggered by a push. Production is deployed from each
  # app's release branch by its release workflow, which watches its own deploy
  # through to a health check — so a push trigger here would only duplicate
  # that or report a false failure.
  #
  # This workflow stays the general dashboard: "what is live right now?"
  workflow_dispatch:
  schedule:
    # Once each morning, off the top of the hour (GitHub's busiest minute).
    - cron: "17 6 * * *"

permissions:
  contents: read
  deployments: read
  actions: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  v1:
    name: V1
    uses: ./.github/workflows/status-check.yml
    with:
      app: V1
      app_url: ${{ vars.APP_URL }}
      source_branch: main_app_V1
      vercel_environment: "Production – chickensfarm"
      vercel_project: prj_lGxEKWmVzsIDudrrmIjQr4e2ojq8
    secrets:
      cron_secret: ${{ secrets.CRON_SECRET }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}

  v2:
    name: V2
    uses: ./.github/workflows/status-check.yml
    with:
      app: V2
      app_url: ${{ vars.APP_URL_V2 }}
      source_branch: main_app_V2
      vercel_environment: "Production – chickensfarm-v2"
      vercel_project: prj_M4VrMiPSLeBK1pDEGbW0f2q9lSOS
    secrets:
      cron_secret: ${{ secrets.CRON_SECRET_V2 }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
