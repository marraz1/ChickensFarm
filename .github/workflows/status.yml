name: Status

# A single place to answer "is production alive, what is deployed, and did the
# migration run?" from the Actions tab, without opening the Vercel dashboard.
#
# Deliberately split into several jobs rather than one. GitHub draws the run's
# visualisation graph from the job dependency tree, so the shape below *is* the
# picture on the run page: probe/deployment/build start together, the checks
# that need live data hang off the probe, and everything converges on a verdict.
# Each job also renders its own section of the summary, which one job could not
# do.
#
# Scope note: Vercel builds the app, GitHub does not, so the *build* log lives in
# Vercel. What GitHub can see for free is the deployment record Vercel writes
# back (status, target URL, commit) — enough to answer "did it ship, and which
# commit is live". The build log itself needs VERCEL_TOKEN; that job reads it
# when the secret exists and explains how to add it when it does not.

on:
  # After a merge, so the question "did what I just merged actually reach
  # production, and is it healthy?" is answered without asking. This workflow
  # never deploys anything — Vercel does that on its own through its Git
  # integration; the run below only watches for the result and reports it.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once each morning, off the top of the hour (GitHub's busiest minute).
    - cron: "17 6 * * *"

permissions:
  contents: read
  # Reading the deployment records Vercel writes, and the reminder run history.
  deployments: read
  actions: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  probe:
    name: Application
    runs-on: ubuntu-latest
    outputs:
      # "ok" | "degraded" | "unreachable" | "outdated" | "unconfigured"
      state: ${{ steps.probe.outputs.state }}
      commit: ${{ steps.probe.outputs.commit }}
      # "current" | "stale" | "unverified" — whether the commit that triggered
      # this run is the one actually being served.
      deployed: ${{ steps.probe.outputs.deployed }}
      # The full body, compacted onto one line, for the jobs downstream. It
      # carries no secrets: configuration is reported as booleans and reminder
      # data as counts.
      health: ${{ steps.probe.outputs.health }}
    steps:
      - name: Query /api/health
        id: probe
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Only a push has a commit that *should* become live as a result of
          # this run. On a schedule or a manual run the deployment is whatever
          # it already was, and waiting for it would be waiting for nothing.
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          # Generous: a Next.js build here takes about two minutes, but Vercel
          # queues under load. Bounded so a deploy that never lands fails the
          # run rather than holding a runner indefinitely.
          DEPLOY_TIMEOUT_SECONDS: 600
        run: |
          echo "## Application" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "health={}"
            echo "deployed=unverified"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$APP_URL" ]; then
            echo "❌ Repository variable \`APP_URL\` is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "state=unconfigured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(printf '%s' "$APP_URL" | sed 's:/*$::')

          # The detailed body is gated on CRON_SECRET; without it the endpoint
          # answers liveness only, which is still worth reporting.
          probe_once() {
            curl -sS -o health.json -w '%{http_code}' \
              --max-time 60 --retry 2 --retry-all-errors \
              --location \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE/api/health" || echo 000
          }

          live_sha() { jq -r '.commit // ""' health.json 2>/dev/null; }

          code=$(probe_once)

          # Wait for the merge to land. Without this the run races Vercel and
          # reports the *previous* deployment as though it were the new one —
          # a green check for code that never shipped.
          #
          # Verified against the commit actually being served rather than
          # against Vercel saying "ready", because those differ: a build can
          # succeed while an older instance keeps serving.
          DEPLOYED=unverified
          if [ -n "$EXPECTED_SHA" ]; then
            # A 404 today can become a 200 once the new build is live, so it is
            # worth waiting through. No commit field at all means liveness-only
            # (no CRON_SECRET), and nothing can be verified — do not spin.
            if [ "$code" = "404" ] || jq -e '.commit' health.json >/dev/null 2>&1; then
              echo "Waiting for \`${EXPECTED_SHA:0:7}\` to be served (up to ${DEPLOY_TIMEOUT_SECONDS}s)..."
              DEADLINE=$((SECONDS + DEPLOY_TIMEOUT_SECONDS))
              DEPLOYED=stale
              while [ "$(live_sha)" != "$EXPECTED_SHA" ]; do
                if [ "$SECONDS" -ge "$DEADLINE" ]; then break; fi
                sleep 15
                code=$(probe_once)
              done
              if [ "$(live_sha)" = "$EXPECTED_SHA" ]; then DEPLOYED=current; fi
              echo "Result: $DEPLOYED after ${SECONDS}s."
            fi
          elif [ -n "$(live_sha)" ]; then
            # Not a push, but drift is still worth naming: the live commit
            # should normally be the head of the default branch.
            if [ "$(live_sha)" = "${GITHUB_SHA}" ]; then DEPLOYED=current; else DEPLOYED=stale; fi
          fi
          echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"

          case "$DEPLOYED" in
            current) echo "✅ Serving \`$(live_sha | cut -c1-7)\` — the commit this run was triggered by." >> "$GITHUB_STEP_SUMMARY" ;;
            stale)   echo "❌ The live deployment is **not** the commit this run was triggered by (\`${GITHUB_SHA:0:7}\`). Serving \`$(live_sha | cut -c1-7)\`." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          if [ "$DEPLOYED" != "unverified" ]; then echo "" >> "$GITHUB_STEP_SUMMARY"; fi

          if [ "$code" = "000" ]; then
            echo "❌ Could not reach \`$BASE/api/health\`." >> "$GITHUB_STEP_SUMMARY"
            echo "state=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A 404 means the deployment predates this endpoint — worth saying
          # plainly rather than reporting the app as broken.
          if [ "$code" = "404" ]; then
            echo "⚠️ \`/api/health\` returned 404 — the live deployment is older than this endpoint." >> "$GITHUB_STEP_SUMMARY"
            echo "state=outdated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e . health.json >/dev/null 2>&1; then
            echo "❌ HTTP $code, and the body was not JSON:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -c 500 health.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "state=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(jq -r '.status' health.json)
          if [ "$STATUS" = "ok" ]; then ICON="✅"; else ICON="❌"; fi
          echo "**$ICON $STATUS** (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if jq -e '.database' health.json >/dev/null 2>&1; then
            echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              "| Commit | `\(.commit // "unknown" | .[0:7])` |",
              "| Environment | \(.environment // "unknown") |",
              "| Region | \(.region // "unknown") |",
              "| Database | \(if .database.connected then "✅ connected (\(.database.latencyMs)ms)" else "❌ \(.database.error // "unreachable")" end) |",
              "| Migrations applied | \(.migrations.appliedCount // "?") |",
              "| Latest migration | `\(.migrations.latest // "none")` |",
              "| Failed migrations | \(if (.migrations.failed // [] | length) == 0 then "none" else "❌ " + (.migrations.failed | join(", ")) end) |",
              "| Reminders enabled | \(.reminders.enabled // 0) |",
              "| Push devices | \(.reminders.subscriptions // 0) |",
              "| Last reminder sent | \(.reminders.lastSentAt // "never") |"
            ' health.json >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Environment configuration</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Presence only — the endpoint never returns a value." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.config | to_entries[] | "- \(if .value then "✅" else "❌" end) `\(.key)`"' \
              health.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Liveness only. Set the \`CRON_SECRET\` secret to unlock database," >> "$GITHUB_STEP_SUMMARY"
            echo "migration and configuration detail._" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "state=$STATUS"
            echo "commit=$(jq -r '.commit // "" | .[0:7]' health.json)"
            echo "health=$(jq -c . health.json)"
          } >> "$GITHUB_OUTPUT"

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.deployments.outputs.state }}
    steps:
      - name: Read deployment records
        id: deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "state=none" >> "$GITHUB_OUTPUT"

          # Vercel's GitHub integration writes a Deployment per push and updates
          # its status as the build runs, so this needs no Vercel credentials.
          if ! gh api "repos/$REPO/deployments?per_page=5" > deployments.json 2>deployments.err; then
            echo "Could not read deployments: $(head -c 300 deployments.err)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(jq 'length' deployments.json)" -eq 0 ]; then
            echo "No deployment records. Vercel writes these through its GitHub" >> "$GITHUB_STEP_SUMMARY"
            echo "integration — if the project was linked with the Vercel CLI instead," >> "$GITHUB_STEP_SUMMARY"
            echo "reconnect it under Vercel → Project → Settings → Git." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "| State | Environment | Commit | Created | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          newest=""
          # One status call per deployment: the deployment itself carries no
          # state, only its most recent status does.
          while IFS=$'\t' read -r id env sha created; do
            status=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" 2>/dev/null || echo '[]')
            state=$(echo "$status" | jq -r '.[0].state // "pending"')
            url=$(echo "$status" | jq -r '.[0].environment_url // .[0].target_url // ""')
            case "$state" in
              success) icon="✅" ;;
              failure|error) icon="❌" ;;
              in_progress|queued|pending) icon="🔄" ;;
              *) icon="•" ;;
            esac
            link=""
            if [ -n "$url" ]; then link="[open]($url)"; fi
            echo "| $icon $state | $env | \`$sha\` | $created | $link |" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$newest" ]; then newest="$state"; fi
          done < <(jq -r '.[] | "\(.id)\t\(.environment)\t\(.sha[0:7])\t\(.created_at)"' deployments.json)

          echo "state=$newest" >> "$GITHUB_OUTPUT"

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: probe
    # Runs even when the probe failed, so the graph completes and the section
    # explains itself rather than silently vanishing.
    if: always()
    outputs:
      state: ${{ steps.compare.outputs.state }}
      pending: ${{ steps.compare.outputs.pending }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare repository against the live database
        id: compare
        env:
          # Passed through the environment, never interpolated into the script:
          # `${{ }}` inside a run block is the classic injection vector, and this
          # value ultimately comes from an HTTP response.
          HEALTH: ${{ needs.probe.outputs.health }}
        run: |
          echo "## Migrations" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$HEALTH" > health.json

          # The repo knows what *should* be applied; the live database knows what
          # *is*. Neither alone can report a pending migration, so the comparison
          # happens here, where both are available.
          ls prisma/migrations | grep -v migration_lock.toml | sort > expected.txt || true
          echo "Repository: $(wc -l < expected.txt) migration(s)." >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '.migrations.applied' health.json >/dev/null 2>&1; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Live state unavailable — see Application._" >> "$GITHUB_STEP_SUMMARY"
            {
              echo "state=unknown"
              echo "pending=?"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -r '.migrations.applied[]' health.json | sort > applied.txt
          PENDING=$(comm -23 expected.txt applied.txt)
          FAILED=$(jq -r '.migrations.failed // [] | length' health.json)
          COUNT=$(if [ -z "$PENDING" ]; then echo 0; else echo "$PENDING" | wc -l; fi)

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ A migration is recorded as started but never finished:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.migrations.failed[] | "- `\(.)`"' health.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Prisma refuses every later migration while this exists (P3009), so" >> "$GITHUB_STEP_SUMMARY"
            echo "each deploy will keep failing until it is resolved:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'DATABASE_URL="<direct-neon-url>" npx prisma migrate resolve --rolled-back <name>' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "state=failed" >> "$GITHUB_OUTPUT"
          elif [ -z "$PENDING" ]; then
            echo "✅ The database is up to date with the repository." >> "$GITHUB_STEP_SUMMARY"
            echo "state=ok" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Pending — present in the repository, not applied to the database:" >> "$GITHUB_STEP_SUMMARY"
            echo "$PENDING" | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Production applies these during \`vercel-build\`. If they are still" >> "$GITHUB_STEP_SUMMARY"
            echo "pending, that step failed — check the Vercel build log, and confirm" >> "$GITHUB_STEP_SUMMARY"
            echo "\`DIRECT_URL\` is set to the unpooled Neon URL (\`prisma migrate deploy\`" >> "$GITHUB_STEP_SUMMARY"
            echo "takes an advisory lock, which the pooled endpoint does not support)." >> "$GITHUB_STEP_SUMMARY"
            echo "state=pending" >> "$GITHUB_OUTPUT"
          fi
          echo "pending=$COUNT" >> "$GITHUB_OUTPUT"

  reminders:
    name: Reminder cron
    runs-on: ubuntu-latest
    needs: probe
    if: always()
    outputs:
      state: ${{ steps.history.outputs.state }}
    steps:
      - name: Read run history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEALTH: ${{ needs.probe.outputs.health }}
        run: |
          echo "## Reminder cron" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$HEALTH" > health.json
          echo "state=unknown" >> "$GITHUB_OUTPUT"

          runs=$(gh api "repos/$REPO/actions/workflows/reminders.yml/runs?per_page=10" 2>/dev/null || echo '{}')
          total=$(echo "$runs" | jq '.workflow_runs // [] | length')

          if [ "$total" -eq 0 ]; then
            echo "No runs found." >> "$GITHUB_STEP_SUMMARY"
          else
            failed=$(echo "$runs" | jq '[.workflow_runs[] | select(.conclusion != "success")] | length')
            echo "Last $total runs: $((total - failed)) succeeded, $failed failed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Scheduled workflows are throttled under load, so the real interval
            # is worth showing next to the one the cron asks for.
            echo "| Started | Result |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "$runs" | jq -r '.workflow_runs[] |
              "| \(.run_started_at) | \(if .conclusion == "success" then "✅" else "❌ " + (.conclusion // "running") end) |"' \
              >> "$GITHUB_STEP_SUMMARY"

            if [ "$failed" -eq 0 ]; then
              echo "state=ok" >> "$GITHUB_OUTPUT"
            else
              echo "state=failing" >> "$GITHUB_OUTPUT"
            fi
          fi

          # The batch reports why nothing was due; surfacing it here means a quiet
          # schedule can be told apart from a stuck one without opening a run.
          if jq -e '.reminders.byReason' health.json >/dev/null 2>&1; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Current state of enabled reminders:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.reminders.byReason | to_entries[] | "- `\(.key)`: \(.value)"' \
              health.json >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.ci.outputs.state }}
    steps:
      - name: Read CI history on the default branch
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "## Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "state=none" >> "$GITHUB_OUTPUT"

          # Asked for rather than assumed to be "main": a repo can be renamed or
          # re-defaulted, and this would then silently report on nothing.
          BRANCH=$(gh api "repos/$REPO" --jq .default_branch 2>/dev/null || echo main)

          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&per_page=10" 2>/dev/null || echo '{}')
          total=$(echo "$runs" | jq '.workflow_runs // [] | length')

          if [ "$total" -eq 0 ]; then
            echo "No CI runs found on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The newest run is the verdict; the rest are context. A single old
          # failure among nine passes is a very different story from a run of
          # reds, and the table shows which one this is.
          latest=$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // "running"')
          sha=$(echo "$runs" | jq -r '.workflow_runs[0].head_sha[0:7]')
          url=$(echo "$runs" | jq -r '.workflow_runs[0].html_url')
          failed=$(echo "$runs" | jq '[.workflow_runs[] | select(.conclusion != "success")] | length')

          if [ "$latest" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          echo "**$ICON $latest** on \`$BRANCH\` at [\`$sha\`]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Last $total runs: $((total - failed)) succeeded, $failed failed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Started | Commit | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$runs" | jq -r '.workflow_runs[] |
            "| \(.run_started_at) | [`\(.head_sha[0:7])`](\(.html_url)) | \(if .conclusion == "success" then "✅" else "❌ " + (.conclusion // "running") end) |"' \
            >> "$GITHUB_STEP_SUMMARY"

          # Per-job detail for the newest run, so a red node says *which* gate
          # failed — lint, typecheck or the suite — without opening the run.
          run_id=$(echo "$runs" | jq -r '.workflow_runs[0].id')
          jobs=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" 2>/dev/null || echo '{}')
          if [ "$(echo "$jobs" | jq '.jobs // [] | length')" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Latest run:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$jobs" | jq -r '.jobs[] |
              "- \(if .conclusion == "success" then "✅" else "❌ " + (.conclusion // "running") end) \(.name)"' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$latest" = "success" ]; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
          else
            echo "state=failing" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build log
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.vercel.outputs.state }}
    steps:
      - name: Fetch the Vercel build log
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
        run: |
          echo "## Build log" >> "$GITHUB_STEP_SUMMARY"
          echo "state=unconfigured" >> "$GITHUB_OUTPUT"

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "_Not configured._ GitHub cannot see Vercel's build output on its" >> "$GITHUB_STEP_SUMMARY"
            echo "own — the build runs on Vercel. To pull it in here:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Create a token at <https://vercel.com/account/tokens> (scope it to this project)." >> "$GITHUB_STEP_SUMMARY"
            echo "2. Add it as the repository secret \`VERCEL_TOKEN\`." >> "$GITHUB_STEP_SUMMARY"
            echo "3. Add the repository variable \`VERCEL_PROJECT\` (the project name)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          Q=""
          if [ -n "$VERCEL_PROJECT" ]; then Q="&projectId=$VERCEL_PROJECT"; fi
          if ! curl -sS --max-time 60 -H "Authorization: Bearer $VERCEL_TOKEN" \
               "https://api.vercel.com/v6/deployments?limit=1&state=BUILDING,ERROR,READY$Q" \
               -o vercel.json; then
            echo "❌ Could not reach the Vercel API." >> "$GITHUB_STEP_SUMMARY"
            echo "state=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '.error' vercel.json >/dev/null 2>&1; then
            echo "❌ Vercel API: $(jq -r '.error.message' vercel.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "state=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UID_=$(jq -r '.deployments[0].uid // empty' vercel.json)
          if [ -z "$UID_" ]; then
            echo "No deployments returned." >> "$GITHUB_STEP_SUMMARY"
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -r '.deployments[0] |
            "- State: **\(.state // .readyState)**",
            "- Created: \(.created / 1000 | todate)",
            "- URL: <https://\(.url)>"' vercel.json >> "$GITHUB_STEP_SUMMARY"

          curl -sS --max-time 60 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v3/deployments/$UID_/events?limit=200" -o events.json || echo '[]' > events.json

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Last build output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Tail rather than head: a build failure is always at the end.
          jq -r '[.[] | select(.type == "stdout" or .type == "stderr") |
                 .payload.text // empty] | .[-60:] | .[]' events.json 2>/dev/null |
            sed 's/\x1b\[[0-9;]*m//g' >> "$GITHUB_STEP_SUMMARY" || \
            echo "(no output returned)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          jq -r '"state=" + ((.deployments[0].state // .deployments[0].readyState // "unknown") | ascii_downcase)' \
            vercel.json >> "$GITHUB_OUTPUT"

  summary:
    name: Verdict
    runs-on: ubuntu-latest
    needs: [probe, deployment, migrations, reminders, build, tests]
    if: always()
    steps:
      - name: Draw the pipeline
        env:
          APP: ${{ needs.probe.outputs.state }}
          COMMIT: ${{ needs.probe.outputs.commit }}
          DEPLOYED: ${{ needs.probe.outputs.deployed }}
          DEPLOY: ${{ needs.deployment.outputs.state }}
          MIGRATE: ${{ needs.migrations.outputs.state }}
          PENDING: ${{ needs.migrations.outputs.pending }}
          CRON: ${{ needs.reminders.outputs.state }}
          BUILD: ${{ needs.build.outputs.state }}
          TESTS: ${{ needs.tests.outputs.state }}
        run: |
          # Mermaid renders natively in a job summary, so the pipeline can be
          # drawn with live colour rather than described. If it ever fails to
          # render it degrades to a readable code block, which is why the node
          # labels carry the state as text and not only as fill colour.
          node_class() {
            case "$1" in
              ok|success|ready) echo ok ;;
              degraded|failed|pending|failing|error|unreachable) echo bad ;;
              outdated|unknown|building|queued) echo warn ;;
              *) echo skip ;;
            esac
          }
          icon() {
            case "$(node_class "$1")" in
              ok) echo "✅" ;;
              bad) echo "❌" ;;
              warn) echo "⚠️" ;;
              *) echo "⏭" ;;
            esac
          }

          # Defaulted once, up front, so the colour and the label can never
          # disagree — reading the state twice with different fallbacks made a
          # failed probe render as a grey "skipped" rather than an amber warning.
          TESTS="${TESTS:-unknown}"
          DEPLOY="${DEPLOY:-none}"
          BUILD="${BUILD:-unknown}"
          MIGRATE="${MIGRATE:-unknown}"
          APP="${APP:-unknown}"
          CRON="${CRON:-unknown}"

          MIGRATE_LABEL="$MIGRATE"
          if [ "$MIGRATE" = "pending" ]; then MIGRATE_LABEL="$PENDING pending"; fi

          {
            echo "## Pipeline"
            echo ""
            echo '```mermaid'
            echo "flowchart LR"
            echo "  T[\"Tests<br/>$(icon "$TESTS") $TESTS\"]:::$(node_class "$TESTS")"
            echo "  D[\"Deploy<br/>$(icon "$DEPLOY") $DEPLOY\"]:::$(node_class "$DEPLOY")"
            echo "  B[\"Build<br/>$(icon "$BUILD") $BUILD\"]:::$(node_class "$BUILD")"
            echo "  M[\"Migrations<br/>$(icon "$MIGRATE") $MIGRATE_LABEL\"]:::$(node_class "$MIGRATE")"
            echo "  A[\"App<br/>$(icon "$APP") $APP\"]:::$(node_class "$APP")"
            echo "  R[\"Reminders<br/>$(icon "$CRON") $CRON\"]:::$(node_class "$CRON")"
            echo "  T --> D --> B --> M --> A --> R"
            echo "  classDef ok fill:#1a7f37,stroke:#1a7f37,color:#ffffff"
            echo "  classDef bad fill:#cf222e,stroke:#cf222e,color:#ffffff"
            echo "  classDef warn fill:#9a6700,stroke:#9a6700,color:#ffffff"
            echo "  classDef skip fill:#57606a,stroke:#57606a,color:#ffffff"
            echo '```'
            echo ""
            echo "| Stage | State |"
            echo "|---|---|"
            echo "| Tests | $(icon "$TESTS") $TESTS |"
            echo "| Deployment | $(icon "$DEPLOY") $DEPLOY |"
            echo "| Build log | $(icon "$BUILD") $BUILD |"
            echo "| Migrations | $(icon "$MIGRATE") $MIGRATE_LABEL |"
            echo "| Application | $(icon "$APP") $APP |"
            echo "| Reminder cron | $(icon "$CRON") $CRON |"
            if [ -n "$COMMIT" ]; then
              echo ""
              case "${DEPLOYED:-unverified}" in
                current) echo "Live commit: \`$COMMIT\` ✅ up to date" ;;
                stale)   echo "Live commit: \`$COMMIT\` ❌ not the commit this run was triggered by" ;;
                *)       echo "Live commit: \`$COMMIT\`" ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reflect health in the run result
        env:
          APP: ${{ needs.probe.outputs.state }}
          MIGRATE: ${{ needs.migrations.outputs.state }}
          TESTS: ${{ needs.tests.outputs.state }}
          DEPLOYED: ${{ needs.probe.outputs.deployed }}
          EVENT: ${{ github.event_name }}
        run: |
          # A green check has to mean something: the run goes red when the app is
          # not healthy, or the database is behind the code.
          FAIL=0
          if [ "$APP" != "ok" ] && [ "$APP" != "outdated" ]; then
            echo "::error::Application health is '$APP' — see the summary."
            FAIL=1
          fi
          if [ "$MIGRATE" = "pending" ] || [ "$MIGRATE" = "failed" ]; then
            echo "::error::Migrations are '$MIGRATE' — see the summary."
            FAIL=1
          fi
          if [ "$TESTS" = "failing" ]; then
            echo "::error::CI is red on the default branch — see the summary."
            FAIL=1
          fi
          # Only on a push: a merge that never reached production is the whole
          # reason this runs after a merge. On a schedule a stale commit is
          # reported but not failed, since nothing was expected to deploy.
          if [ "$EVENT" = "push" ] && [ "$DEPLOYED" = "stale" ]; then
            echo "::error::The merged commit is not being served — the Vercel deploy did not land in time."
            FAIL=1
          fi
          exit $FAIL
