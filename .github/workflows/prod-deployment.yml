name: PROD_deployment

# The only way code reaches production.
#
# Production is deployed from `release`, and this workflow is the only thing
# that writes to it: it versions `main`, fast-forwards `release`, tags, and then
# watches Vercel build and deploy the result until a health check confirms that
# the exact version published is the one being served.
#
# Split into five sequential jobs so the run graph *is* the release pipeline and
# each stage is visible while it happens rather than only once it ends.
#
#   preflight -> release -> deploy -> verify -> summary
#
# This workflow does not build anything itself. Vercel builds and deploys
# `release` through its Git integration; everything here either prepares that
# push or reports on what Vercel then does.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, custom]
      version:
        description: "Exact version, when bump = custom (e.g. 1.4.0)"
        type: string
        required: false
      dry_run:
        description: "Run every check and change nothing"
        type: boolean
        required: false
        default: false
      allow_destructive:
        description: "Proceed even if a pending migration drops or rewrites data"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  deployments: read
  actions: read

concurrency:
  # Never two releases at once: they would race for the same branch and tag.
  group: prod-deployment
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release
  SOURCE_BRANCH: main

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.checks.outputs.version }}
      previous: ${{ steps.checks.outputs.previous }}
      # Applied migrations before this release, so `verify` can report exactly
      # what the release changed rather than just what exists afterwards.
      applied_before: ${{ steps.checks.outputs.applied_before }}
      pending: ${{ steps.checks.outputs.pending }}
      # The migrations this release will actually apply, so the safety scan can
      # read exactly those rather than guessing from history.
      pending_list: ${{ steps.checks.outputs.pending_list }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate and plan the release
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "## Preflight" >> "$GITHUB_STEP_SUMMARY"
          FAIL=0

          # 1. Released from main only. Dispatching from a feature branch would
          #    quietly ship whatever happened to be on it.
          if [ "$GITHUB_REF_NAME" != "$SOURCE_BRANCH" ]; then
            echo "❌ Dispatch this from \`$SOURCE_BRANCH\`, not \`$GITHUB_REF_NAME\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PROD_deployment must be run from $SOURCE_BRANCH"
            exit 1
          fi

          # 2. CI must be green on main. Only a completed run can be judged — an
          #    in-progress one says nothing, and treating it as a failure (or as
          #    a pass) would both be wrong.
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$SOURCE_BRANCH&per_page=20" 2>/dev/null || echo '{}')
          row=$(echo "$runs" | jq -c '[.workflow_runs[]? | select(.status == "completed")][0] // empty')
          if [ -z "$row" ]; then
            echo "❌ No completed CI run on \`$SOURCE_BRANCH\` to judge." >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          else
            CI_CONCLUSION=$(echo "$row" | jq -r '.conclusion')
            CI_SHA=$(echo "$row" | jq -r '.head_sha[0:7]')
            CI_URL=$(echo "$row" | jq -r '.html_url')
            if [ "$CI_CONCLUSION" = "success" ]; then
              echo "✅ CI green on \`$SOURCE_BRANCH\` at [\`$CI_SHA\`]($CI_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ CI is \`$CI_CONCLUSION\` on \`$SOURCE_BRANCH\` at [\`$CI_SHA\`]($CI_URL)" >> "$GITHUB_STEP_SUMMARY"
              FAIL=1
            fi
          fi

          # 3. release must be a fast-forward of main. Anything else means
          #    someone pushed to release directly, and merging would either
          #    conflict or silently revert their commit.
          if git rev-parse --verify "origin/$RELEASE_BRANCH" >/dev/null 2>&1; then
            if git merge-base --is-ancestor "origin/$RELEASE_BRANCH" "origin/$SOURCE_BRANCH"; then
              AHEAD=$(git rev-list --count "origin/$RELEASE_BRANCH..origin/$SOURCE_BRANCH")
              echo "✅ \`$RELEASE_BRANCH\` fast-forwards cleanly — $AHEAD commit(s) to ship" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ \`$RELEASE_BRANCH\` has commits that are not on \`$SOURCE_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Only this workflow should write to \`$RELEASE_BRANCH\`. Merge it back first:" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "git checkout $SOURCE_BRANCH && git merge origin/$RELEASE_BRANCH && git push" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              FAIL=1
            fi
          else
            echo "ℹ️ \`$RELEASE_BRANCH\` does not exist yet — it will be created from \`$SOURCE_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          # 4. Work out the next version.
          PREVIOUS=$(jq -r '.version' package.json)
          if [ "$BUMP" = "custom" ]; then
            NEXT="$CUSTOM"
            if ! printf '%s' "$NEXT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "❌ \`$NEXT\` is not a valid version (expected X.Y.Z)." >> "$GITHUB_STEP_SUMMARY"
              FAIL=1
              NEXT="$PREVIOUS"
            fi
          else
            IFS=. read -r MA MI PA <<< "$PREVIOUS"
            case "$BUMP" in
              major) NEXT="$((MA + 1)).0.0" ;;
              minor) NEXT="$MA.$((MI + 1)).0" ;;
              *)     NEXT="$MA.$MI.$((PA + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null 2>&1; then
            echo "❌ Tag \`v$NEXT\` already exists." >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`$PREVIOUS\` → \`$NEXT\` (\`$BUMP\`)" >> "$GITHUB_STEP_SUMMARY"

          # 5. What is live now, and what this release will migrate. Shown
          #    before anything is pushed, so the operator can still stop.
          APPLIED_BEFORE="[]"
          if [ -n "$APP_URL" ]; then
            BASE=$(printf '%s' "$APP_URL" | sed 's:/*$::')
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 60 --location \
              -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/health" || echo 000)
            if jq -e '.migrations.applied' health.json >/dev/null 2>&1; then
              APPLIED_BEFORE=$(jq -c '.migrations.applied' health.json)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Live now:** version \`$(jq -r '.version // "unknown"' health.json)\`, commit \`$(jq -r '.commit // "unknown" | .[0:7]' health.json)\`" >> "$GITHUB_STEP_SUMMARY"

              jq -r '.migrations.applied[]' health.json | sort > applied.txt
              ls prisma/migrations | grep -v migration_lock.toml | sort > expected.txt || true
              PENDING=$(comm -23 expected.txt applied.txt)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              if [ -z "$PENDING" ]; then
                echo "**Migrations:** none pending — this release is code only." >> "$GITHUB_STEP_SUMMARY"
                {
                  echo "pending=0"
                  echo "pending_list=[]"
                } >> "$GITHUB_OUTPUT"
              else
                COUNT=$(echo "$PENDING" | wc -l)
                echo "**Migrations:** $COUNT will be applied during the production build:" >> "$GITHUB_STEP_SUMMARY"
                echo "$PENDING" | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
                {
                  echo "pending=$COUNT"
                  # Compact JSON on one line: a job output cannot carry newlines.
                  echo "pending_list=$(printf '%s\n' "$PENDING" | jq -R . | jq -sc .)"
                } >> "$GITHUB_OUTPUT"
              fi
            else
              echo "⚠️ Could not read migration state (HTTP $code). Set \`CRON_SECRET\` to see it." >> "$GITHUB_STEP_SUMMARY"
              {
                echo "pending=?"
                echo "pending_list="
              } >> "$GITHUB_OUTPUT"
            fi
          else
            echo "⚠️ \`APP_URL\` is not set — cannot report what is live." >> "$GITHUB_STEP_SUMMARY"
            {
              echo "pending=?"
              echo "pending_list="
            } >> "$GITHUB_OUTPUT"
          fi

          {
            echo "version=$NEXT"
            echo "previous=$PREVIOUS"
            echo "applied_before=$APPLIED_BEFORE"
          } >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🧪 **Dry run** — nothing will be pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $FAIL

  # ---------------------------------------------------------------------------
  # Gates. Everything below fans out of preflight and back into `release`, so
  # nothing is pushed, tagged or deployed until all five pass.
  #
  # These run on a dry run too — proving a release *would* work is the whole
  # point of a dry run. Only `release` onward is skipped.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: preflight
    env:
      # `next build` never contacts the database; prisma generate only reads the
      # URL to pick a provider.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The gap this closes: before this job existed the build was only proven
      # after `release` had been tagged and pushed, so a build failure left a
      # bad tag and a release branch pointing at broken code.
      - name: Build
        run: npm run build

  schema:
    name: Schema checks
    runs-on: ubuntu-latest
    needs: preflight
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Migrations apply cleanly
        run: |
          echo "## Schema checks" >> "$GITHUB_STEP_SUMMARY"
          # Against a throwaway database, so every migration is proven to run on
          # a clean schema before production ever attempts it.
          if npx prisma migrate deploy; then
            echo "✅ All migrations apply cleanly to an empty database." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ A migration failed to apply to an empty database." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: No schema drift
        run: |
          # Exit 2 means schema.prisma was edited without a matching migration,
          # so production would run code expecting a shape the database has not
          # been given. Prisma 7 spells this `--to-schema`.
          set +e
          OUT=$(npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          case "$CODE" in
            0)
              echo "✅ No schema drift — \`schema.prisma\` matches the migrations." >> "$GITHUB_STEP_SUMMARY" ;;
            2)
              echo "❌ \`schema.prisma\` has changes with no migration behind them:" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' "$OUT" | tail -40 >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Run \`npx prisma migrate dev\` and commit the generated migration." >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            *)
              echo "❌ Drift check failed to run (exit $CODE)." >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac

      - name: Migration safety scan
        env:
          PENDING_LIST: ${{ needs.preflight.outputs.pending_list }}
          ALLOW: ${{ inputs.allow_destructive }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Which migrations this release will actually apply. The pending list
          # from preflight is the truth; the tag fallback covers a run where
          # /api/health could not be reached.
          SOURCE=""
          : > to_scan.txt
          if [ -n "$PENDING_LIST" ] && [ "$PENDING_LIST" != "[]" ]; then
            printf '%s' "$PENDING_LIST" | jq -r '.[]' > to_scan.txt
            SOURCE="pending against production"
          elif [ -z "$PENDING_LIST" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -n "$PREV_TAG" ]; then
              git diff --name-only --diff-filter=A "$PREV_TAG"..HEAD -- prisma/migrations \
                | awk -F/ '{print $3}' | sort -u > to_scan.txt
              SOURCE="added since $PREV_TAG"
            fi
          else
            SOURCE="none pending"
          fi

          if [ ! -s to_scan.txt ]; then
            if [ "$SOURCE" = "none pending" ]; then
              echo "✅ No migrations in this release — nothing to scan." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ Could not determine which migrations this release applies, so" >> "$GITHUB_STEP_SUMMARY"
              echo "the safety scan was skipped. Not blocking." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # Statements that drop data, rewrite a column in place, or rename
          # something the currently-deployed code still refers to.
          PATTERN='DROP[[:space:]]+TABLE|DROP[[:space:]]+COLUMN|DROP[[:space:]]+TYPE|TRUNCATE|ALTER[[:space:]]+COLUMN.*[[:space:]]TYPE[[:space:]]|SET[[:space:]]+NOT[[:space:]]+NULL|RENAME'

          : > findings.txt
          while read -r m; do
            [ -n "$m" ] || continue
            f="prisma/migrations/$m/migration.sql"
            [ -f "$f" ] || continue
            grep -inE "$PATTERN" "$f" | sed "s|^|$m:|" >> findings.txt || true
          done < to_scan.txt

          echo "Scanned $(wc -l < to_scan.txt) migration(s) — $SOURCE." >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s findings.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No destructive statements found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ **Destructive statements in this release:**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          cat findings.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALLOW" = "true" ]; then
            echo "Proceeding: **allow_destructive** was ticked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Release blocked. These change or remove data that the currently" >> "$GITHUB_STEP_SUMMARY"
          echo "deployed code may still be using, and they cannot be undone by" >> "$GITHUB_STEP_SUMMARY"
          echo "rolling back the deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run with **allow_destructive** ticked to proceed deliberately," >> "$GITHUB_STEP_SUMMARY"
          echo "or split the change so the column is stopped being written first" >> "$GITHUB_STEP_SUMMARY"
          echo "and dropped in a later release." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Destructive migration blocked — see the summary."
          exit 1

  release:
    name: Version and promote
    runs-on: ubuntu-latest
    needs: [preflight, lint, typecheck, test, build, schema]
    # One job on purpose: bump, merge, tag and push belong together, and
    # spreading them over runners would leave half-released states behind.
    if: ${{ inputs.dry_run != true }}
    outputs:
      sha: ${{ steps.promote.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Persisted so the pushes below reuse it.
          token: ${{ github.token }}

      - name: Bump, merge into release and tag
        id: promote
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          echo "## Version and promote" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pinned to the remote ref rather than relying on whatever state
          # actions/checkout left behind, so this is the same operation whether
          # the local branch exists, is detached, or has drifted.
          git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"

          echo "Bumping package.json to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # package-lock.json carries the version too, but only add it if npm
          # actually touched it — `git add` on an unchanged path is fine, on a
          # missing one is not.
          git add package.json
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          git commit -m "chore(release): v$VERSION"
          git push origin "$SOURCE_BRANCH"
          echo "✅ \`$SOURCE_BRANCH\` bumped to \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

          # Fast-forward release onto main. Preflight already proved this is
          # possible, so a merge commit is never needed and never created.
          if git rev-parse --verify "origin/$RELEASE_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git merge --ff-only "$SOURCE_BRANCH"
          else
            git checkout -B "$RELEASE_BRANCH" "$SOURCE_BRANCH"
          fi

          SHA=$(git rev-parse HEAD)
          git tag -a "v$VERSION" -m "Release v$VERSION"

          # The push to release is what triggers Vercel's production build.
          git push origin "$RELEASE_BRANCH"
          git push origin "v$VERSION"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ \`$RELEASE_BRANCH\` now at \`${SHA:0:7}\`, tagged \`v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel builds \`$RELEASE_BRANCH\` from here." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: [preflight, release]
    outputs:
      state: ${{ steps.watch.outputs.state }}
      url: ${{ steps.watch.outputs.url }}
    steps:
      - name: Watch Vercel build the release
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.release.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TIMEOUT_SECONDS: 1200
        run: |
          echo "## Build and deploy" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "state=unknown"
            echo "url="
          } >> "$GITHUB_OUTPUT"

          # Vercel's GitHub integration writes a deployment record for the push
          # and updates its status as the build runs. That is free and needs no
          # Vercel credentials; the token only adds the build output.
          DEPLOY_URL=""
          VERCEL_UID=""
          STATE=""
          SEEN=0

          check_github() {
            local id st
            for id in $(gh api "repos/$REPO/deployments?sha=$SHA&per_page=20" --jq '.[].id' 2>/dev/null); do
              SEEN=1
              st=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // "queued"' 2>/dev/null || echo queued)
              case "$st" in
                success|failure|error)
                  DEPLOY_URL=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" \
                    --jq '.[0].environment_url // .[0].target_url // ""' 2>/dev/null || echo "")
                  STATE="$st"
                  return 0 ;;
              esac
              PHASE="$st"
            done
            return 0
          }

          resolve_vercel_uid() {
            [ -n "$VERCEL_TOKEN" ] || return 0
            [ -z "$VERCEL_UID" ] || return 0
            curl -sS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?limit=1&sha=$SHA" -o v.json 2>/dev/null || return 0
            VERCEL_UID=$(jq -r '.deployments[0].uid // empty' v.json 2>/dev/null || echo "")
            return 0
          }

          echo "Waiting for the production deployment of ${SHA:0:7} (up to ${TIMEOUT_SECONDS}s)..."
          DEADLINE=$((SECONDS + TIMEOUT_SECONDS))
          LAST=""
          POLL=0
          PHASE="not-yet-created"
          while :; do
            POLL=$((POLL + 1))
            PHASE="not-yet-created"
            check_github
            resolve_vercel_uid
            [ -n "$STATE" ] && break

            # A line on every transition, and otherwise once a minute — so a
            # long build still reads as alive instead of as a hung job.
            if [ "$PHASE" != "$LAST" ] || [ $((POLL % 4)) -eq 0 ]; then
              echo "  [${SECONDS}s] $PHASE"
              LAST="$PHASE"
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              if [ "$SEEN" = "1" ]; then STATE=timeout; else STATE=none; fi
              break
            fi
            sleep 15
          done
          echo "Result: $STATE after ${SECONDS}s."

          {
            echo "state=$STATE"
            echo "url=$DEPLOY_URL"
          } >> "$GITHUB_OUTPUT"

          case "$STATE" in
            success)
              echo "✅ Vercel deployed \`${SHA:0:7}\` to production." >> "$GITHUB_STEP_SUMMARY" ;;
            failure|error)
              echo "❌ The production build of \`${SHA:0:7}\` failed." >> "$GITHUB_STEP_SUMMARY" ;;
            timeout)
              echo "⚠️ The build had not finished within ${TIMEOUT_SECONDS}s." >> "$GITHUB_STEP_SUMMARY" ;;
            none)
              echo "❌ No deployment record appeared for \`${SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Check that Vercel's **Production Branch** is set to \`$RELEASE_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
              echo "under Project → Settings → Git." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          if [ -n "$DEPLOY_URL" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment: <$DEPLOY_URL>" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The build output, which is where a failed migration or a prerender
          # error actually explains itself.
          resolve_vercel_uid
          if [ -n "$VERCEL_UID" ]; then
            curl -sS --max-time 60 -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v3/deployments/$VERCEL_UID/events?limit=300" -o events.json || echo '[]' > events.json
            OPEN=""
            if [ "$STATE" != "success" ]; then OPEN=" open"; fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details$OPEN><summary>Vercel build output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '[.[] | select(.type == "stdout" or .type == "stderr") |
                   .payload.text // empty] | .[-80:] | .[]' events.json 2>/dev/null |
              sed 's/\x1b\[[0-9;]*m//g' >> "$GITHUB_STEP_SUMMARY" || \
              echo "(no output returned)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$VERCEL_TOKEN" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Add a \`VERCEL_TOKEN\` secret to show the build output here._" >> "$GITHUB_STEP_SUMMARY"
          fi

          case "$STATE" in
            failure|error|none) exit 1 ;;
          esac

  verify:
    name: Verify live
    runs-on: ubuntu-latest
    needs: [preflight, release, deploy]
    outputs:
      state: ${{ steps.check.outputs.state }}
      migrated: ${{ steps.check.outputs.migrated }}
      smoke: ${{ steps.smoke.outputs.state }}
    steps:
      - name: Confirm the new version is being served
        id: check
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERSION: ${{ needs.preflight.outputs.version }}
          APPLIED_BEFORE: ${{ needs.preflight.outputs.applied_before }}
          SHA: ${{ needs.release.outputs.sha }}
          TIMEOUT_SECONDS: 600
        run: |
          echo "## Verify live" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "state=unknown"
            echo "migrated=0"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$APP_URL" ]; then
            echo "❌ \`APP_URL\` is not set — cannot verify." >> "$GITHUB_STEP_SUMMARY"
            echo "state=unconfigured" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          BASE=$(printf '%s' "$APP_URL" | sed 's:/*$::')

          probe() {
            curl -sS -o health.json -w '%{http_code}' --max-time 60 --location \
              -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/health" || echo 000
          }
          live_version() { jq -r '.version // ""' health.json 2>/dev/null; }
          live_commit()  { jq -r '.commit  // ""' health.json 2>/dev/null; }

          # A successful deploy is not the same as the new code being served:
          # Vercel can report ready while an older instance still answers. The
          # version and the commit both have to match before this is a release.
          echo "Waiting for v$VERSION (${SHA:0:7}) to be served (up to ${TIMEOUT_SECONDS}s)..."
          DEADLINE=$((SECONDS + TIMEOUT_SECONDS))
          POLL=0
          code=$(probe)
          while [ "$(live_version)" != "$VERSION" ] || [ "$(live_commit)" != "$SHA" ]; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then break; fi
            sleep 15
            POLL=$((POLL + 1))
            code=$(probe)
            echo "  [${SECONDS}s] poll #$POLL: HTTP $code, serving v$(live_version | sed 's/^$/?/') ($(live_commit | cut -c1-7))"
          done

          LIVE_V=$(live_version)
          LIVE_C=$(live_commit)
          if [ "$LIVE_V" = "$VERSION" ] && [ "$LIVE_C" = "$SHA" ]; then
            STATE=ok
            echo "✅ Serving **v$VERSION** at \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            STATE=stale
            echo "❌ Expected **v$VERSION** at \`${SHA:0:7}\`, but production is serving" >> "$GITHUB_STEP_SUMMARY"
            echo "**v${LIVE_V:-unknown}** at \`${LIVE_C:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          # What this release actually migrated, as a difference against the
          # snapshot preflight took before anything was pushed.
          MIGRATED=0
          if jq -e '.migrations.applied' health.json >/dev/null 2>&1; then
            jq -r '.migrations.applied[]' health.json | sort > after.txt
            printf '%s' "$APPLIED_BEFORE" | jq -r '.[]' 2>/dev/null | sort > before.txt || : > before.txt
            NEW=$(comm -13 before.txt after.txt)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$NEW" ]; then
              echo "**Migrations:** none applied by this release." >> "$GITHUB_STEP_SUMMARY"
            else
              MIGRATED=$(echo "$NEW" | wc -l)
              echo "**Migrations applied ($MIGRATED):**" >> "$GITHUB_STEP_SUMMARY"
              echo "$NEW" | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
            fi

            FAILED=$(jq -r '.migrations.failed // [] | length' health.json)
            if [ "$FAILED" -gt 0 ]; then
              STATE=migration-failed
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "❌ A migration started and never finished:" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.migrations.failed[] | "- `\(.)`"' health.json >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Prisma refuses every later migration while this exists (P3009):" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo 'DATABASE_URL="<direct-neon-url>" npx prisma migrate resolve --rolled-back <name>' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          HEALTH=$(jq -r '.status // "unknown"' health.json 2>/dev/null)
          if [ "$HEALTH" != "ok" ] && [ "$STATE" = "ok" ]; then STATE=degraded; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Health:** $HEALTH" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "state=$STATE"
            echo "migrated=$MIGRATED"
          } >> "$GITHUB_OUTPUT"
          [ "$STATE" = "ok" ] || exit 1

      - name: Smoke test key URLs
        id: smoke
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Smoke tests" >> "$GITHUB_STEP_SUMMARY"
          echo "state=unknown" >> "$GITHUB_OUTPUT"
          BASE=$(printf '%s' "$APP_URL" | sed 's:/*$::')

          FAIL=0
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | Status | Type | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # /api/health proves the server is up. It does not prove the app
          # renders, or that assets are served as the right thing — so check a
          # few real URLs the way a browser would.
          check() {
            local path="$1" want_code="$2" want_type="$3"
            local code type ok icon
            code=$(curl -sS -o body.out -w '%{http_code}' --max-time 30 --location \
              "$BASE$path" 2>/dev/null || echo 000)
            type=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 30 --location \
              "$BASE$path" 2>/dev/null || echo "")

            ok=1
            [ "$code" = "$want_code" ] || ok=0
            # The content-type assertion is not decoration: /sw.js once came
            # back as /login HTML because middleware redirected it, and the
            # browser refused to register the worker on MIME type. A
            # status-only check passes that happily.
            if [ -n "$want_type" ]; then
              case "$type" in *"$want_type"*) ;; *) ok=0 ;; esac
            fi

            if [ "$ok" = "1" ]; then icon="✅"; else icon="❌"; FAIL=1; fi
            echo "| \`$path\` | $code | ${type%%;*} | $icon |" >> "$GITHUB_STEP_SUMMARY"
            echo "  $icon $path -> $code ${type%%;*}"
          }

          check /login 200 "text/html"
          check /manifest.webmanifest 200 ""
          check /sw.js 200 "javascript"
          check / 200 "text/html"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" = "0" ]; then
            echo "✅ All smoke checks passed." >> "$GITHUB_STEP_SUMMARY"
            echo "state=ok" >> "$GITHUB_OUTPUT"
          else
            echo "❌ A smoke check failed — the deployment is live but not serving correctly." >> "$GITHUB_STEP_SUMMARY"
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Smoke test failed — see the summary."
            exit 1
          fi

  summary:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [preflight, lint, typecheck, test, build, schema, release, deploy, verify]
    if: always()
    steps:
      - name: Draw the release
        env:
          PRE: ${{ needs.preflight.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.typecheck.result }}
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          SCHEMA: ${{ needs.schema.result }}
          SMOKE: ${{ needs.verify.outputs.smoke }}
          REL: ${{ needs.release.result }}
          DEP: ${{ needs.deploy.outputs.state }}
          DEP_JOB: ${{ needs.deploy.result }}
          VER: ${{ needs.verify.outputs.state }}
          VER_JOB: ${{ needs.verify.result }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PREVIOUS: ${{ needs.preflight.outputs.previous }}
          SHA: ${{ needs.release.outputs.sha }}
          URL: ${{ needs.deploy.outputs.url }}
          MIGRATED: ${{ needs.verify.outputs.migrated }}
          DRY: ${{ inputs.dry_run }}
        run: |
          # Same visual language as ci.yml and status.yml, so all three read as
          # one system: green passed, red failed, amber inconclusive, grey not run.
          node_class() {
            case "$1" in
              ok|success) echo ok ;;
              failure|error|failed|stale|migration-failed|degraded|none) echo bad ;;
              timeout|unknown|cancelled) echo warn ;;
              *) echo skip ;;
            esac
          }
          icon() {
            case "$(node_class "$1")" in
              ok) echo "✅" ;; bad) echo "❌" ;; warn) echo "⚠️" ;; *) echo "⏭" ;;
            esac
          }

          PRE="${PRE:-unknown}"
          LINT="${LINT:-unknown}"
          TYPES="${TYPES:-unknown}"
          TESTS="${TESTS:-unknown}"
          BUILD="${BUILD:-unknown}"
          SCHEMA="${SCHEMA:-unknown}"
          SMOKE="${SMOKE:-$VER_JOB}"; SMOKE="${SMOKE:-unknown}"
          REL="${REL:-unknown}"
          DEP="${DEP:-$DEP_JOB}"; DEP="${DEP:-unknown}"
          VER="${VER:-$VER_JOB}"; VER="${VER:-unknown}"
          MIG="$MIGRATED"
          if [ -z "$MIG" ] || [ "$MIG" = "0" ]; then MIG="none"; else MIG="$MIG applied"; fi
          if [ "$DRY" = "true" ]; then REL="dry-run"; DEP="dry-run"; VER="dry-run"; SMOKE="dry-run"; fi

          {
            echo "## Release"
            echo ""
            echo '```mermaid'
            echo "flowchart LR"
            echo "  P[\"Preflight<br/>$(icon "$PRE") $PRE\"]:::$(node_class "$PRE")"
            echo "  L[\"Lint<br/>$(icon "$LINT") $LINT\"]:::$(node_class "$LINT")"
            echo "  T[\"Typecheck<br/>$(icon "$TYPES") $TYPES\"]:::$(node_class "$TYPES")"
            echo "  S[\"Test<br/>$(icon "$TESTS") $TESTS\"]:::$(node_class "$TESTS")"
            echo "  U[\"Build<br/>$(icon "$BUILD") $BUILD\"]:::$(node_class "$BUILD")"
            echo "  X[\"Schema<br/>$(icon "$SCHEMA") $SCHEMA\"]:::$(node_class "$SCHEMA")"
            echo "  V[\"Version<br/>$(icon "$REL") $REL\"]:::$(node_class "$REL")"
            echo "  D[\"Deploy<br/>$(icon "$DEP") $DEP\"]:::$(node_class "$DEP")"
            echo "  M[\"Migrations<br/>$MIG\"]:::skip"
            echo "  H[\"Health<br/>$(icon "$VER") $VER\"]:::$(node_class "$VER")"
            echo "  K[\"Smoke<br/>$(icon "$SMOKE") $SMOKE\"]:::$(node_class "$SMOKE")"
            echo "  P --> L --> V"
            echo "  P --> T --> V"
            echo "  P --> S --> V"
            echo "  P --> U --> V"
            echo "  P --> X --> V"
            echo "  V --> D --> M --> H --> K"
            echo "  classDef ok fill:#1a7f37,stroke:#1a7f37,color:#ffffff"
            echo "  classDef bad fill:#cf222e,stroke:#cf222e,color:#ffffff"
            echo "  classDef warn fill:#9a6700,stroke:#9a6700,color:#ffffff"
            echo "  classDef skip fill:#57606a,stroke:#57606a,color:#ffffff"
            echo '```'
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Checks | lint $(icon "$LINT") · types $(icon "$TYPES") · tests $(icon "$TESTS") · build $(icon "$BUILD") · schema $(icon "$SCHEMA") |"
            echo "| Version | \`${PREVIOUS:-?}\` → \`${VERSION:-?}\` |"
            if [ -n "$SHA" ]; then echo "| Release commit | \`${SHA:0:7}\` |"; fi
            if [ -n "$VERSION" ]; then echo "| Tag | \`v$VERSION\` |"; fi
            echo "| Migrations | $MIG |"
            echo "| Smoke | $(icon "$SMOKE") $SMOKE |"
            if [ -n "$URL" ]; then echo "| Production | <$URL> |"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        env:
          PRE: ${{ needs.preflight.result }}
          GATES: ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.schema.result }}
          REL: ${{ needs.release.result }}
          DEP: ${{ needs.deploy.result }}
          VER: ${{ needs.verify.result }}
          DRY: ${{ inputs.dry_run }}
        run: |
          # A dry run still has to prove the gates: that is what it is for.
          if [ "$DRY" = "true" ]; then
            echo "Dry run: preflight=$PRE gates=$GATES"
            [ "$PRE" = "success" ] || exit 1
            for r in $GATES; do
              if [ "$r" != "success" ]; then
                echo "::error::A release check did not pass ($GATES)."
                exit 1
              fi
            done
            exit 0
          fi
          echo "preflight=$PRE gates=$GATES release=$REL deploy=$DEP verify=$VER"
          for r in "$PRE" $GATES "$REL" "$DEP" "$VER"; do
            if [ "$r" != "success" ]; then
              echo "::error::Release did not complete (preflight=$PRE release=$REL deploy=$DEP verify=$VER)."
              exit 1
            fi
          done
