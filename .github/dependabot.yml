version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # V1's line (#242). Named explicitly: Dependabot otherwise follows the
    # default branch, which becomes main_app_V2 (#244).
    target-branch: main_app_V1
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # eslint-plugin-react (bundled in eslint-config-next) only supports
      # eslint <=9.7 as of 2026-09-08 — eslint 10 crashes the react/display-name
      # rule. Remove once eslint-config-next ships a compatible major bump.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (bundled in eslint-config-next) only supports
      # typescript <6.1.0 as of 2026-09-08. Remove once it adds TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
