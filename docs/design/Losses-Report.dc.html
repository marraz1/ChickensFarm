body{margin:0}
a{text-decoration:none;color:inherit}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}

.card{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent);padding:16px}
.big p:first-child{font-size:14px;line-height:20px;color:var(--muted-foreground)}
.big p:last-child{font-size:24px;line-height:32px;font-weight:600}
.line{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.line b{font-size:18px;line-height:28px;font-weight:600}
.mut{color:var(--muted-foreground)}

.tab{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 0;border:0;background:transparent;font:inherit;color:var(--muted-foreground);font-size:11px;line-height:16px}
.tab span{display:flex;align-items:center;justify-content:center;height:28px}
.tab.on{color:var(--primary)}
.plus{width:28px;height:28px;border-radius:999px;background:var(--primary);color:var(--primary-foreground)}
</style>

<button type="submit" style="height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--foreground)">Filtruoti</button>

<div class="card line"><span>Parduota</span><b>2</b></div>

</div>
