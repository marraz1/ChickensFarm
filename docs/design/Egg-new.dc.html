<style>

</helmet>
<div style="--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--primary:oklch(0.205 0 0);--primary-foreground:oklch(0.985 0 0);--muted-foreground:oklch(0.556 0 0);--accent:oklch(0.97 0 0);--accent-foreground:oklch(0.205 0 0);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);--ring:oklch(0.708 0 0);position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:oklch(0.991 0 0);color:var(--foreground);font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased">

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)">
<div style="display:flex;flex-direction:column;align-items:flex-start">
<span style="font-size:12px;line-height:16px;color:var(--muted-foreground)">Ūkis</span>
<span style="display:flex;align-items:center;gap:4px;font-size:18px;line-height:28px;font-weight:500">Mano ūkis
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
</div>
<button type="button" aria-label="Profilis" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;padding:0;border-radius:999px;background:var(--accent);color:var(--accent-foreground)">

</button>

<main style="flex:1">

<form style="display:flex;flex-direction:column;gap:16px;padding:0 16px">

<label for="collectionDate" style="font-size:14px;line-height:14px;font-weight:500">Data</label>
<input id="collectionDate" type="date" value="2026-10-27" style="box-sizing:border-box;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:4px 10px;font:inherit;font-size:16px;color:var(--foreground)">
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="quantity" style="font-size:14px;line-height:14px;font-weight:500">Kiekis</label>
<input id="quantity" type="number" inputmode="numeric" min="1" value="12" style="box-sizing:border-box;width:100%;height:44px;border:1px solid var(--ring);border-radius:10px;background:transparent;padding:4px 10px;font:inherit;font-size:16px;color:var(--foreground);outline:none;box-shadow:0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent)">
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="birdGroupId" style="font-size:14px;line-height:14px;font-weight:500">Paukščių grupė (neprivaloma)</label>
<button id="birdGroupId" type="button" style="box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:0 10px;font:inherit;font-size:14px;color:var(--muted-foreground);text-align:left">Nenurodyta<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<button type="submit" style="height:44px;margin-top:8px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:14px;font-weight:500">Išsaugoti</button>
</form>
</main>

<nav style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;background:color-mix(in oklch, var(--card) 95%, transparent);border-top:1px solid var(--border);backdrop-filter:blur(8px)">
<a href="Main.dc.html" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 0;color:var(--muted-foreground);font-size:11px;line-height:16px"><span style="display:flex;align-items:center;height:28px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Pradžia</a>
<a href="Birds.dc.html" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 0;color:var(--muted-foreground);font-size:11px;line-height:16px"><span style="display:flex;align-items:center;height:28px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></svg></span>Paukščiai</a>
<button type="button" aria-label="Pridėti įrašą" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 0;border:0;background:transparent;color:var(--muted-foreground);font:inherit;font-size:11px;line-height:16px"><span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--primary);color:var(--primary-foreground)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>Pridėti</button>
<a href="#" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 0;color:var(--muted-foreground);font-size:11px;line-height:16px"><span style="display:flex;align-items:center;height:28px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>Finansai</a>
<a href="Incubation.dc.html" style="display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 0;color:var(--muted-foreground);font-size:11px;line-height:16px"><span style="display:flex;align-items:center;height:28px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C8 2 4 8 4 14a8 8 0 0 0 16 0c0-6-4-12-8-12"/></svg></span>Perinimas</a>
</nav>
</div>
