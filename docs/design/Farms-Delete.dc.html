<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Ištrinti ūkį</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
p{margin:0}
.btn{height:32px;padding:0 10px;border-radius:10px;border:1px solid transparent;font:inherit;font-size:14px;font-weight:500}
</style>
</helmet>
<div style="--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--accent:oklch(0.97 0 0);--destructive:oklch(0.577 0.245 27.325);--border:oklch(0.922 0 0);position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:oklch(0.991 0 0);color:var(--foreground);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased">
<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)">
<div style="display:flex;flex-direction:column"><span style="font-size:12px;line-height:16px;color:var(--muted-foreground)">Ūkis</span><span style="font-size:18px;line-height:28px;font-weight:500">Mano ūkis</span></div>
<div style="width:36px;height:36px;border-radius:999px;background:var(--accent)"></div>
</header>
<div style="padding:16px"><p style="font-size:18px;line-height:28px;font-weight:600">Ūkio nustatymai</p></div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,.5)"></div>
<div role="dialog" aria-label="Ištrinti ūkį?" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;width:342px;display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent)">
<h2 style="margin:0;font-size:16px;line-height:22px;font-weight:500">Ištrinti ūkį?</h2>
<p style="font-size:14px;line-height:20px;color:var(--muted-foreground)">Ūkis bus paslėptas ir nebebus matomas sąrašuose. Šio veiksmo negalėsite atšaukti patys.</p>
<div style="display:flex;justify-content:flex-end;gap:8px">
<button type="button" class="btn" style="background:var(--card);border-color:var(--border);color:var(--foreground)">Atšaukti</button>
<button type="button" class="btn" style="background:color-mix(in oklch,var(--destructive) 10%,transparent);color:var(--destructive)">Taip, ištrinti</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
