<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Nauja išlaida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
p{margin:0}
.ph{display:flex;align-items:center;gap:4px;padding:16px}
.ph h1{margin:0;font-size:18px;line-height:28px;font-weight:600}
.bk{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-8px;color:var(--muted-foreground)}
.mut{color:var(--muted-foreground)}
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:14px;line-height:14px;font-weight:500}
.inp{box-sizing:border-box;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:4px 10px;font:inherit;font-size:16px;color:var(--foreground)}
.sel{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:0 10px;font:inherit;font-size:14px;color:var(--foreground);text-align:left}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-top:1px solid var(--border);font-size:14px}
.opt:first-child{border-top:0}
.opt input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.btn{height:44px;margin-top:8px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:14px;font-weight:500}
</style>
</helmet>
<div style="--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--primary:oklch(0.205 0 0);--primary-foreground:oklch(0.985 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--accent:oklch(0.97 0 0);--accent-foreground:oklch(0.205 0 0);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:oklch(0.991 0 0);color:var(--foreground);font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased">
<dc-import name="V2Header" hint-size="100%,69px"></dc-import>
<main style="flex:1;overflow:hidden;padding-bottom:64px">
<div class="ph"><a href="V2-Eggs-Expenses.dc.html" class="bk" aria-label="Grįžti"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><h1>Nauja išlaida</h1></div>
<form style="display:flex;flex-direction:column;gap:16px;padding:0 16px">
<fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:6px">
<legend class="lbl" style="padding:0;margin-bottom:6px">Sritis</legend>
<div style="border:1px solid var(--input);border-radius:10px;background:var(--card)">
<label class="opt"><input type="radio" name="sec" checked>Kiaušiniai ir prekyba</label>
<label class="opt"><input type="radio" name="sec">Perekšlės</label>
<label class="opt"><input type="radio" name="sec">Perinimas</label>
<label class="opt"><input type="radio" name="sec">Mėsiniai paukščiai</label>
<label class="opt"><input type="radio" name="sec">Bendra (visam ūkiui)</label>
</div>
<p class="mut" style="font-size:12px;line-height:16px">Išlaida bus įskaičiuota į šios srities ir viso ūkio finansus.</p>
</fieldset>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<div class="fld"><label class="lbl" for="d">Data</label><input class="inp" id="d" type="date" value="2026-10-27"></div>
<div class="fld"><label class="lbl" for="a">Suma (€)</label><input class="inp" id="a" inputmode="decimal" placeholder="pvz. 12,50" value="18,90"></div>
</div>
<div class="fld"><label class="lbl" for="c">Kategorija</label><button id="c" type="button" class="sel">Pašarai<svg class="mut" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
<div class="fld"><label class="lbl" for="x">Aprašymas</label><input class="inp" id="x" value="Lesalas dedeklėms, 25 kg"></div>
<button type="submit" class="btn">Išsaugoti</button>
</form>
</main>
<div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="V2Nav" active="eggs" hint-size="100%,64px"></dc-import></div>
</div>
</x-dc>

}
</script>
</body>
</html>
