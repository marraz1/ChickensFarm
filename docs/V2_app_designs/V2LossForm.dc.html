<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>V2 nuostolio forma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<form style="--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--primary:oklch(0.205 0 0);--primary-foreground:oklch(0.985 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:16px;padding:0 16px 16px;font-family:'Geist',system-ui,sans-serif;color:var(--foreground)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;box-sizing:border-box;padding:0 12px;border-radius:10px;background:var(--muted)">
<span style="font-size:13px;color:var(--muted-foreground)">Sritis</span>
<span style="font-size:14px;font-weight:500">{{name}}</span>
</div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="loss-target" style="font-size:14px;line-height:14px;font-weight:500">{{target}}</label><button id="loss-target" type="button" style="box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:0 10px;font:inherit;font-size:14px;color:var(--foreground);text-align:left">{{targetVal}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><span style="font-size:12px;line-height:16px;color:var(--muted-foreground)">{{hint}}</span></div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<div style="display:flex;flex-direction:column;gap:6px"><label for="loss-date" style="font-size:14px;line-height:14px;font-weight:500">Data</label><input id="loss-date" type="date" value="2026-10-27" style="box-sizing:border-box;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:4px 10px;font:inherit;font-size:16px;color:var(--foreground)"></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="loss-qty" style="font-size:14px;line-height:14px;font-weight:500">{{qtyLabel}}</label><input id="loss-qty" type="number" inputmode="numeric" min="1" value="1" style="box-sizing:border-box;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:4px 10px;font:inherit;font-size:16px;color:var(--foreground)"></div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:14px;line-height:14px;font-weight:500">Priežastis</span>
<div role="group" aria-label="Priežastis" style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
<button type="button" aria-pressed="true" style="height:44px;border:1px solid var(--primary);border-radius:10px;background:var(--primary);font:inherit;font-size:14px;font-weight:500;color:var(--primary-foreground)">Liga</button>
<button type="button" aria-pressed="false" style="height:44px;border:1px solid var(--border);border-radius:10px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--muted-foreground)">Plėšrūnas</button>
<button type="button" aria-pressed="false" style="height:44px;border:1px solid var(--border);border-radius:10px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--muted-foreground)">Kita</button>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="loss-note" style="font-size:14px;line-height:14px;font-weight:500">Komentaras</label><input id="loss-note" placeholder="pvz. lapė, šlubavo" style="box-sizing:border-box;width:100%;height:44px;border:1px solid var(--input);border-radius:10px;background:transparent;padding:4px 10px;font:inherit;font-size:16px;color:var(--foreground)"></div>
<button type="submit" style="height:44px;margin-top:8px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:14px;font-weight:500">Išsaugoti</button>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sec":{"editor":"enum","options":["Eggs","Hens","Inc","Meat"],"default":"Eggs"},"$preview":{"width":390,"height":460}}'>
class Component extends DCLogic {
renderVals() {
const M = {
Eggs: { name: 'Kiaušiniai ir prekyba', target: 'Dedeklių grupė', targetVal: 'Vištidė A · Brama', qtyLabel: 'Kiekis', hint: 'Grupės kiekis bus sumažintas ir įrašytas į istoriją.' },
Hens: { name: 'Perekšlės', target: 'Perekšlė', targetVal: 'Rita', qtyLabel: 'Kiekis', hint: 'Perekšlė bus pažymėta kaip nugaišusi.' },
Inc: { name: 'Perinimas', target: 'Perinimo ciklas', targetVal: 'Vasaros partija', qtyLabel: 'Jauniklių', hint: 'Gyvų jauniklių skaičius cikle bus sumažintas.' },
Meat: { name: 'Mėsiniai paukščiai', target: 'Mėsinių grupė', targetVal: 'Pekino antis', qtyLabel: 'Kiekis', hint: 'Grupės kiekis bus sumažintas ir įrašytas į istoriją.' }
};
return M[this.props.sec] ?? M.Eggs;
}
}
</script>
</body>
</html>
